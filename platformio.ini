[env:marble]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = groundstudio_marble_pico
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L
board_build.usb_mode = pico_sdk
monitor_speed = 115200


build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    ; Selectia modelului de LCD (HAL) — valori in lib/TesterHAL/LcdConfig.h
    ; -DLCD_MODEL=1   ; Model 1 - Blue Tab (ILI9341 240x320)
    ; -DLCD_MODEL=2   ; Model 2 - ST7789 240x320
    ; -DLCD_MODEL=3   ; Model 3 - ST7735 128x160


lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    adafruit/Adafruit ST7735 and ST7789 Library





